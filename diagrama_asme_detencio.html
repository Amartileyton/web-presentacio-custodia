        * {

        body {

            flex-direction: column;

            font-size: 13px;
            color: #94a3b8;
        }

            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-download:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }
        .viewer-container {
            width: 100%;
            max-width: 1400px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 8px;
        }
        .diagram-img {
            width: 100%;
            height: auto;
            max-width: 1380px;
            display: block;
            border-radius: 4px;
        }
